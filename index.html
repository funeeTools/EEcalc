<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a4250" />
    <title>EEcalc</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c47b17'/%3E%3Ctext x='16' y='23' font-size=%2714%27 font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'%3EEE%3C/text%3E%3C/svg%3E" />
    <script>
      // Apply the saved colour theme before first paint (core/settings repeats this once loaded).
      try {
        var t = (JSON.parse(localStorage.getItem('eecalc:settings') || '{}').theme) || 'system';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
